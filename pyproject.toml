[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dgn-explorer"
version = "0.2.0"
description = "Reversible DGN V8 metadata workspaces with verified compound-file rebuilding"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
desktop = ["PySide6-Essentials==6.11.2", "shiboken6==6.11.2"]

[project.scripts]
dgn-explorer = "dgn_folder:main"
dgn-workspace = "dgn_folder:main"

[project.gui-scripts]
dgn-explorer-gui = "dgn_explorer.ui:main"

[tool.setuptools]
py-modules = ["dgn_folder"]
packages = ["dgn_explorer"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}